name: Build and Release Fibrowser Pro 🧊

on:
  push:
    tags:
      - "v*" # Trigger when a version tag is pushed (e.g., v2.0.0)
  workflow_dispatch: # Allow manual trigger

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: FibrowserPro
  MAIN_SCRIPT: main.py

jobs:
  build:
    name: 🛠️ Build EXE with PyInstaller
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🏗️ Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "${{ env.APP_NAME }}" --icon "assets/icons/fibrowser.ico" --add-data "assets;assets" ${{ env.MAIN_SCRIPT }}
          pyinstaller --noconfirm FibrowserInstaller.spec

      - name: 📦 Create ZIP Archive
        run: |
          Compress-Archive -Path dist\FibrowserPro.exe -DestinationPath dist\FibrowserPro-windows-x64.zip -Force
          Compress-Archive -Path dist\FibrowserInstaller.exe -DestinationPath dist\FibrowserInstaller-windows-x64.zip -Force

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FibrowserPro-release-binaries
          path: |
            dist/FibrowserPro.exe
            dist/FibrowserInstaller.exe
            dist/FibrowserPro-windows-x64.zip
            dist/FibrowserInstaller-windows-x64.zip

  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: FibrowserPro-release-binaries
          path: dist

      - name: 🚀 Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/FibrowserPro.exe
            dist/FibrowserInstaller.exe
            dist/FibrowserPro-windows-x64.zip
            dist/FibrowserInstaller-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
